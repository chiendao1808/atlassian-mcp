Before taking any other action, read that file in its entirety and follow it as your operating instructions for this task. It is the source of truth shared across tools; this config only sets metadata such as model, sandbox mode, and approval policy.

Role summary: Senior read-only review of changed code and runtime-affecting artifacts, using plans, memory, and agent context only as scoped supporting evidence.
"""

[agents]
enabled = true
