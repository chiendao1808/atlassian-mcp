# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: atlassian-mcp

builds:
  - id: atlassian-mcp
    main: ./cmd/atlassian-mcp
    binary: atlassian-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - linux_amd64_v1
      - windows_amd64_v1

archives:
  - id: raw-binaries
    ids:
      - atlassian-mcp
    # binary uploads the executables directly; no zip or tar archives are produced.
    formats:
      - binary
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# temporary: restore Debian packaging, checksum, and SBOM entries after the Ubuntu CI failure is diagnosed.
# nfpms:
