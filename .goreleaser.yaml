checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256
  ids:
    - raw-binaries
#    - deb

sboms:
  # Keep one SBOM per delivery artifact so release validation can match names exactly.
  - id: binary-sboms
    artifacts: binary
    ids:
      - raw-binaries
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.json"
#  - id: deb-sbom
#    artifacts: package
#    ids:
#      - deb

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git

release:
  github:
    owner: chiendao1808
    name: atlassian-mcp
  draft: true
  replace_existing_draft: true
